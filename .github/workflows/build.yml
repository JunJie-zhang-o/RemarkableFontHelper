name: Build Executables

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller main.spec

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: RemarkableFontHelper-Linux
          path: dist/

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: RemarkableFontHelper-macOS
          path: dist/

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RemarkableFontHelper-Windows
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: RemarkableFontHelper-Linux
          path: artifacts/Linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: RemarkableFontHelper-macOS
          path: artifacts/macOS

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: RemarkableFontHelper-Windows
          path: artifacts/Windows

      - name: Package artifacts
        run: |
          cd artifacts
          zip -r RemarkableFontHelper-Linux.zip Linux/
          zip -r RemarkableFontHelper-macOS.zip macOS/
          zip -r RemarkableFontHelper-Windows.zip Windows/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/RemarkableFontHelper-Linux.zip
            artifacts/RemarkableFontHelper-macOS.zip
            artifacts/RemarkableFontHelper-Windows.zip
